<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef5ff"><title>Student Follow-up</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>
.follow-wrap{max-width:1180px;margin:0 auto;padding:38px 4vw 60px}.follow-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.follow-brand{font-weight:800;color:#16366b}.follow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.follow-card{background:#fff;border:1px solid #dce5f2;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(20,50,90,.05)}.follow-stat span{display:block;color:#71809a;font-size:12px;margin-bottom:8px}.follow-stat b{font-size:19px;color:#16366b;word-break:break-word}.follow-section{margin-top:16px}.follow-table{width:100%;border-collapse:collapse}.follow-table th,.follow-table td{text-align:left;padding:12px 10px;border-bottom:1px solid #e7edf5;font-size:13px}.follow-table th{color:#71809a;font-size:11px}.follow-exams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.follow-exam{padding:16px}.follow-exam-meta{margin-top:10px}.skill{margin:15px 0}.skill-top{display:flex;justify-content:space-between;margin-bottom:7px}.bar{height:9px;background:#e9eef6;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#2563eb;border-radius:99px}.error{color:#a33b3b}.muted{color:#71809a}@media(max-width:850px){.follow-grid{grid-template-columns:repeat(2,1fr)}.follow-exams{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.follow-wrap{padding:24px 14px 45px}.follow-head{display:block}.follow-brand{margin-top:10px}.follow-grid,.follow-exams{grid-template-columns:1fr}.follow-card{padding:17px}.follow-table{min-width:650px}.follow-card:has(.follow-table){overflow-x:auto}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const pathParts=location.pathname.split('/').filter(Boolean);const token=decodeURIComponent(pathParts[0]==='follow'? (pathParts[1]||'') : (pathParts[0]==='followup'? (pathParts[1]||new URLSearchParams(location.search).get('token')||'') : ''));const ar=new URLSearchParams(location.search).get('lang')==='ar';
function pageError(msg){app.innerHTML=`<div class="follow-wrap"><div class="follow-card"><div class="eyebrow">${ar?'متابعة الطالب':'Student Follow-up'}</div><h1>${ar?'تعذر تحميل بيانات الطالب':'Unable to load student data'}</h1><p class="error">${esc(msg)}</p></div></div>`}
async function load(){if(!token)return pageError(ar?'رابط المتابعة غير صالح.':'Invalid follow-up link.');try{const r=await fetch('/api/follow/'+encodeURIComponent(token),{credentials:'omit'});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||'This follow-up link is invalid or no longer active.');const s=d.student||{},results=Array.isArray(d.results)?d.results:[],skills=Array.isArray(d.skills)?d.skills:[],exams=Array.isArray(d.exams)?d.exams:[],st=d.stats||{};document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';app.innerHTML=`<div class="follow-wrap"><header class="follow-head"><div><div class="eyebrow">${ar?'متابعة الطالب':'Student Follow-up'}</div><h1>${esc(s.full_name||'Student')}</h1><p class="muted">${esc(s.student_id||'')} · ${esc(s.grade_level||'')} · ${esc(s.group_name||'—')} · ${s.education_system==='azhar'?(ar?'أزهري':'Azhar'):(ar?'عام':'General')}</p></div><div class="follow-brand">${ar?'منصة الامتحانات':'Exam Platform'}</div></header>
<section class="follow-grid"><div class="follow-card follow-stat"><span>${ar?'الاسم':'Name'}</span><b>${esc(s.full_name||'—')}</b></div><div class="follow-card follow-stat"><span>${ar?'المرحلة التعليمية':'Educational stage'}</span><b>${esc(s.grade_level||'—')}</b></div><div class="follow-card follow-stat"><span>${ar?'المجموعة':'Group'}</span><b>${esc(s.group_name||'—')}</b></div><div class="follow-card follow-stat"><span>${ar?'رقم ولي الأمر':'Parent phone'}</span><b>${esc(s.parent_phone||'—')}</b></div></section>
<section class="follow-grid follow-section"><div class="follow-card follow-stat"><span>${ar?'الامتحانات المكتملة':'Completed exams'}</span><b>${st.completed||0}</b></div><div class="follow-card follow-stat"><span>${ar?'متوسط الأداء':'Average performance'}</span><b>${Number(st.average||0).toFixed(1)}%</b></div><div class="follow-card follow-stat"><span>${ar?'أفضل نتيجة':'Best result'}</span><b>${Number(st.best||0).toFixed(1)}%</b></div><div class="follow-card follow-stat"><span>${ar?'عدد مرات النجاح':'Passed exams'}</span><b>${st.passed||0}</b></div></section>
<section class="follow-card follow-section"><div class="eyebrow">${ar?'الامتحانات':'Exams'}</div><h2>${ar?'امتحانات الطالب':'Student exams'}</h2>${exams.length?`<div class="follow-exams">${exams.map(e=>`<div class="follow-card follow-exam"><b>${esc(e.title)}</b><div class="follow-exam-meta">${e.result_id?`<span class="pill ${e.passed?'pass':'fail'}">${Number(e.percentage||0).toFixed(1)}%</span>`:`<span class="pill">${ar?'لم يؤد بعد':'Not taken'}</span>`}</div></div>`).join('')}</div>`:`<p class="muted">${ar?'لا توجد امتحانات متاحة حالياً.':'No assigned exams available.'}</p>`}</section>
<section class="follow-card follow-section"><div class="eyebrow">${ar?'نتائج الامتحانات':'Exam Results'}</div><h2>${ar?'النتائج المسجلة':'Recorded results'}</h2>${results.length?`<table class="follow-table"><thead><tr><th>${ar?'الامتحان':'Exam'}</th><th>${ar?'الدرجة':'Score'}</th><th>%</th><th>${ar?'الحالة':'Status'}</th><th>${ar?'التاريخ':'Date'}</th></tr></thead><tbody>${results.map(r=>`<tr><td><b>${esc(r.title)}</b></td><td>${esc(r.score)} / ${esc(r.total_points)}</td><td>${Number(r.percentage||0).toFixed(1)}%</td><td><span class="pill ${r.passed?'pass':'fail'}">${r.passed?(ar?'ناجح':'Passed'):(ar?'لم ينجح':'Not passed')}</span></td><td>${esc(r.created_at||'')}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">${ar?'لا توجد نتائج مسجلة بعد.':'No exam results yet.'}</p>`}</section>
<section class="follow-card follow-section"><div class="eyebrow">${ar?'إحصائيات الأداء':'Performance analysis'}</div><h2>${ar?'الأداء حسب المهارة':'Performance by skill'}</h2>${skills.length?skills.map(x=>`<div class="skill"><div class="skill-top"><b>${esc(x.skill)}</b><strong>${Number(x.percentage||0).toFixed(1)}%</strong></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(x.percentage)||0))}%"></span></div></div>`).join(''):`<p class="muted">${ar?'لا توجد بيانات مهارات بعد.':'No skill data yet.'}</p>`}</section></div>`}catch(e){pageError(e.message)}}load();
</script></body></html>
